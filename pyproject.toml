[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kidneygrid"
version = "0.1.0"
description = "Privacy-preserving kidney paired exchange across hospitals with collaborative Flower Agents"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0", "openai>=2.16.0,<3.0.0"]

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "scipy>=1.13", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["kidneygrid"]

[tool.flwr.app]
publisher = "kdotmahesh"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["kidneygrid/**/*.py", "kidneygrid/data/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "kidneygrid.agent_app:app"

[tool.flwr.app.config]
action = "match"
reject-edge = ""
model = "openai/gpt-5.6-sol"
